name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ["29.4", "30.2", "31.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - uses: extractions/setup-just@v4
      - name: Install dependencies
        run: |
          emacs -Q --batch --eval "(progn (require (quote package)) (package-initialize) (package-refresh-contents) (package-install (quote consult)))"
      - name: Compile, checkdoc, test
        run: make all
